[pytest]
# 该目录独立于仓库根 pytest 配置（根配置默认排除 android/e2e）。
# 这里显式启用 android/e2e marker，并用 asyncio_mode=auto 支持 async 用例。
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    android: requires an Android device or emulator connected to the Artemis host
    e2e: requires a running Artemis daemon
addopts = --tb=short
